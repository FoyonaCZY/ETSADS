[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
glam = { version = "0.30", features = ["serde"] }
rstar = "0.12"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Third-party crates without debug info: most of target/debug was their
# DWARF (26 GB of deps); our own crates stay fully debuggable.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

